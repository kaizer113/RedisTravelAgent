[project]
name = "value-travel"
version = "1.0.0"
description = "VALUE TRAVEL — a Redis Iris travel concierge"
requires-python = ">=3.11,<3.14"
dependencies = [
 "context-surfaces>=0.0.1", "fastapi>=0.116", "google-genai>=2.24.0",
 "httpx>=0.28", "pydantic-settings>=2.10", "redis>=6.2",
 "redis-agent-memory==0.2.0", "redisvl>=0.23,<0.24",
 "sentence-transformers>=5.1,<6", "torch>=2.1,<3", "uvicorn[standard]>=0.35"
]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "ruff>=0.12"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
