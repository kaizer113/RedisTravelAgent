name: value_travel_offers
source:
  server_name: sqlserver
  db: value_travel
  schema: dbo
  table: offers
transform:
  - uses: add_field
    with:
      field: average_price_per_person
      language: sql
      expression: >-
        CASE WHEN room_capacity > 0
        THEN ROUND(1.0 * total_price / room_capacity, 2)
        ELSE NULL END
output:
  - uses: redis.write
    with:
      connection: target
      data_type: json
      key:
        expression: concat(['value-travel:context:offer:', package_id])
        language: jmespath
      mapping:
        - package_id
        - name
        - destination
        - total_price
        - available_rooms
        - room_capacity
        - average_price_per_person
        - eligible_reward_base
        - cancellation
        - departure_date
        - data_label
