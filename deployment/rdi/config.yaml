# SQL Server in the existing lionel-iris-peered GKE cluster.
# Validated and deployed with RDI 2.0.0.
sources:
  sqlserver:
    type: cdc
    connection:
      type: sqlserver
      host: sqlserver.demo-access.svc.cluster.local
      port: 1433
      database: value_travel
      user: ${SQLSERVER_DB_USERNAME}
      password: ${SQLSERVER_DB_PASSWORD}
    schemas:
      - dbo
    tables:
      dbo.offers: {}
    advanced:
      source:
        decimal.handling.mode: double
        database.encrypt: true
        database.trustServerCertificate: true
        poll.interval.ms: 500
targets:
  target:
    connection:
      type: redis
      host: cantabile-consummate-micropolished-92484.db.redis.io
      port: 17518
      user: ${TARGET_DB_USERNAME}
      password: ${TARGET_DB_PASSWORD}
processors:
  type: classic
  target_data_type: json
